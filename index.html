<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S7ADOWS Upload</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    width:350px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

a{
    color:#38bdf8;
    word-break:break-all;
}

.preview{
    margin-top:15px;
    max-width:100%;
    border-radius:10px;
}

textarea{
    width:100%;
    height:70px;
    margin-top:10px;
    border-radius:10px;
    padding:10px;
    background:#0f172a;
    color:white;
    border:none;
}

</style>
</head>
<body>

<div class="box">

<h2>S7ADOWS UPLOAD</h2>

<input type="file" id="file">

<br>

<button onclick="uploadFile()">
Upload
</button>

<div id="preview"></div>

<div id="result"></div>

</div>

<script>

async function uploadFile(){

    const file =
        document.getElementById('file').files[0]

    if(!file){

        alert("Choose file")

        return
    }

    const form = new FormData()

    form.append('file', file)

    const res = await fetch('/api/upload', {
        method:'POST',
        body:form
    })

    const data = await res.json()

    if(!data.status){

        alert(data.error)

        return
    }

    const apiCode =
`fetch('${window.location.origin}/api/upload', {
  method: 'POST',
  body: formData
})`

    let preview = ''

    // معاينة الصور
    if(file.type.startsWith('image/')){

        preview =
        `<img class="preview" src="${data.url}">`

    }

    // معاينة الفيديو
    else if(file.type.startsWith('video/')){

        preview =
        `
        <video class="preview" controls>
            <source src="${data.url}">
        </video>
        `

    }

    document.getElementById('preview').innerHTML =
        preview

    document.getElementById('result').innerHTML = `

        <p>File URL:</p>

        <a href="${data.url}" target="_blank">
            ${data.url}
        </a>

        <br>

        <button onclick="copyText('${data.url}')">
            Copy File Link
        </button>

        <h3>API Example</h3>

        <textarea id="apiBox">${apiCode}</textarea>

        <button onclick="copyApi()">
            Copy API
        </button>

    `

}

// نسخ الرابط
function copyText(text){

    navigator.clipboard.writeText(text)

    alert("Copied")

}

// نسخ API
function copyApi(){

    const text =
        document.getElementById('apiBox').value

    navigator.clipboard.writeText(text)

    alert("API Copied")

}

</script>

</body>
</html>
